<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HS, Physics: Electricity and magnetism</title>
  <link rel="stylesheet" href="../../../../../styles/style.css" />
</head>

<body class="tracks-body gradient-background">
  <header class="tracks-header">
    <div class="container tracks-header-content">
      <a href="../../../../dashboard/student-dashboard.html" data-dashboard-link class="tracks-logo-link" aria-label="Back to dashboard">
        <img src="../../../../../../public/assets/logos/Kelp-logo-gpt.png" alt="Kelp logo" class="tracks-logo" />
      </a>

      <nav class="tracks-nav" aria-label="Track navigation">
        <a href="../HS_physics_modules.html">Back</a>
        <a href="../../../../dashboard/student-dashboard.html" data-dashboard-link>Home</a>
      </nav>
    </div>
  </header>

  <main class="container tracks-main" aria-labelledby="page-title">
    <section class="tracks-panel">
      <div class="tracks-intro">
        <p class="tracks-kicker">High school physics</p>
        <h1 id="page-title">Physics: Electricity and magnetism</h1>
        <p>Select a module to open its sessions and activities.</p>
      </div>

      <div class="link-list modules-grid">
        <a href="../Modules 16-20/HSP_module_18.html" class="link-card">
          <span class="link-title">Module 18</span>
          <span class="link-description">Electrostatics</span>
        </a>
        <a href="../Modules 16-20/HSP_module_19.html" class="link-card">
          <span class="link-title">Module 19</span>
          <span class="link-description">Electrodynamics</span>
        </a>
        <a href="../Modules 16-20/HSP_module_20.html" class="link-card">
          <span class="link-title">Module 20</span>
          <span class="link-description">Magnetism</span>
        </a>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const links = document.querySelectorAll("[data-dashboard-link]");
      if (!links.length) return;

      const readStorage = (key) => {
        try {
          return localStorage.getItem(key) || sessionStorage.getItem(key) || "";
        } catch (error) {
          return "";
        }
      };

      const pickDashboardFile = (value) => {
        const text = String(value || "").toLowerCase();
        if (text.includes("tutor-dashboard.html")) return "tutor-dashboard.html";
        if (text.includes("student-dashboard.html")) return "student-dashboard.html";
        return "";
      };

      const pickDashboardRole = (value) => {
        const role = String(value || "").trim().toLowerCase();
        if (["teacher", "tutor", "mentor", "admin"].includes(role)) return "tutor-dashboard.html";
        if (role === "student") return "student-dashboard.html";
        return "";
      };

      const dashboard = [document.referrer].map(pickDashboardFile).find(Boolean)
        || [readStorage("kelpUserRole"), readStorage("userRole"), readStorage("role")].map(pickDashboardRole).find(Boolean)
        || [readStorage("kelpDashboardTarget")].map(pickDashboardFile).find(Boolean);
      if (!dashboard) return;

      try {
        localStorage.setItem("kelpDashboardTarget", dashboard);
      } catch (error) {}

      links.forEach((link) => {
        const href = link.getAttribute("href") || "";
        link.setAttribute("href", href.replace(/(?:student|tutor)-dashboard\.html$/i, dashboard));
      });
    })();
    document.querySelectorAll("[data-read-aloud]").forEach((button) => {
      button.addEventListener("click", () => {
        const text = button.getAttribute("data-read-aloud") || "";
        if (!("speechSynthesis" in window) || !text) return;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      });
    });
  </script>
</body>
</html>
