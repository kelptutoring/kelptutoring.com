<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Kelp Tutoring</title>
  <link rel="stylesheet" href="../../styles/style.css" />
  <script type="module" src="../../auth/signUp.js"></script>
</head>

<body class="gradient-body-2">
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <h1 style="color: var(--color-secondary)">Welcome</h1>
        <p>Create a new account</p>
      </div>  
    
    <form id="signup-form" class="auth-form">
      <div class="input-group">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" required />
      </div>
    
      <div class="input-group">
        <label for="birthDate">Birth date</label>
        <input id="birthDate" type="date" required />
      </div>
    
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" type="email" required />
      </div>
    
      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" type="password" required />
      </div>
      
      <button type="submit" class="btn btn-terciary">Create account</button>
      <a href="./login.html" class="btn-secondary header-btn">Log in</a>
     
    </form>

  <p id="message"></p>
</main>
</body>
</html>
